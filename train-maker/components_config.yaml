global:
  backgrounds_dir: output/backgrounds
  output_dir: output
  dataset_dir: dataset
  training_mode: per_component

  # Split real. val_ratio > 0 es obligatorio: antes el data.yaml apuntaba
  # val al mismo directorio que train y las métricas no medían nada (H2).
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # Presupuesto ÚNICO de imágenes sin objetos. Antes se acumulaban por tres
  # vías distintas y el dataset terminaba ~50 % negativo (H7).
  negative_ratio: 0.2
  negative_empty_fraction: 0.33
  # Negativos sintéticos inyectados en el fine-tune real, como fracción de
  # las imágenes reales. Antes era una constante de 3000 (H6).
  finetune_negative_ratio: 0.15

  # Composición del sprite: FRACCIÓN DEL LADO MENOR DEL FONDO (H8).
  # Calibrado contra backgrounds.target_symbol_px = 64 sobre tiles de 640:
  # un símbolo típico ocupa 0.10 del tile. El rango cubre ±60 %.
  sprite_scale_min: 0.06
  sprite_scale_max: 0.16
  components_per_img_min: 1
  components_per_img_max: 4
  allow_random_rotation: true

  # Instancias cortadas por el borde, como en los tiles de SAHI (H12).
  edge_crop_ratio: 0.15
  min_visible_area: 0.4
  max_placement_iou: 0.15

  binarize_threshold: 200
  render_dpi: 200
  yolo_workspace: yolo_workspace
  yolo_model: yolo11s.pt
  epochs: 300
  patience: 50
  batch_size: 16
  workers: 0
  imgsz: 640
  # lr0 ahora SÍ llega a Ultralytics; antes el loader lo descartaba (H9).
  lr0: 0.01
  lrf: 0.01
  optimizer: auto
  cos_lr: false
  epochs_finetune: 100
  lr0_finetune: 0.001
  lrf_finetune: 0.01
  # Backbone descongelado: el dominio sintético es muy distinto del real,
  # congelarlo impide justamente la adaptación que se busca (H6).
  freeze_finetune: 0
  seed: 42
  project: Liard_Detection

backgrounds:
  # Antes estaba en false y la carpeta de salida tenía 500 copias de la misma
  # imagen en blanco (H3).
  enabled: true
  # Apunta directo a la carpeta dxf/ del proyecto: no hace falta duplicar
  # los planos dentro de train-maker.
  dxf_sources_dir: ../dxf
  tile_size: 640
  overlap: 320
  min_std_dev: 6.0
  min_ink_fraction: 0.010
  # Escala de render: un símbolo del plano debe medir ~64 px, igual que en
  # inferencia. De acá sale la calibración de sprite_scale_min/max.
  target_symbol_px: 64
  # Rechazo de tiles que contienen símbolos, para no meter instancias del
  # target sin etiquetar dentro del fondo (H1 con datos reales).
  min_circle_radius: 0.15
  min_hatch_side: 0.15
  symbol_margin_px: 24
  render_window_px: 2560
  max_render_windows: 120
  max_tiles_per_plan: 1500
  # test1 / test_2 son el set de evaluación: NUNCA como fondo de training,
  # si no se contamina la única métrica honesta que queda.
  # jijiji y OCJ-... quedan afuera por tamaño (58 MB cada uno).
  exclude_stems:
  - test1
  - test_2
  - test2
  - jijiji
  - ocj-de-iel-uni-000-001-o03
  - plano3_con_detecciones
  - plano5

augmentation:
  # Calibrado para DIBUJO TÉCNICO, no para fotografía natural (H11).
  hsv_h: 0.0        # el plano es monocromático
  hsv_s: 0.1
  hsv_v: 0.4        # simula escaneos más claros u oscuros
  degrees: 3.0      # escaneos torcidos
  translate: 0.1
  scale: 0.5
  shear: 2.0
  perspective: 0.0
  flipud: 0.0       # los símbolos eléctricos son quirales
  fliplr: 0.0       # idem; la orientación ya la cubre la rotación 0/90/180/270
  mosaic: 1.0
  mixup: 0.0        # promediar dibujos de línea genera trazos fantasma
  copy_paste: 0.0   # requiere máscaras; en detect se ignora
  erasing: 0.1      # bajo: el símbolo ya es casi todo espacio en blanco

modifiers:
  dir: input/modifiers
  probability: 0.0
  count_min: 1
  count_max: 1
  allow_rotation: true
  thickness_dilation:
  - 1
  - 3

validation:
  max_missing_labels_pct: 5.0

components:

# ── Con datos reales de Roboflow: fase 1 sintética + fase 2 fine-tune ──────

- name: interruptor_termomagnetico
  dxf_path:
  - input/components/interruptor_termomagnetico.dxf
  polarity_filters: [invert, threshold]
  sprite_variations: 24
  line_thickness_range: [3, 20]
  skip_training: false
  images_to_generate: 6000
  roboflow_zip_path: ../zips_datasets/interruptor_termomagnetico.yolov11.zip
  exclude_as_negative: [interruptor_diferencial]
  hard_negatives:
    seccionador_bajo_carga: 0.30
    guardamotor_con_proteccion_electromagnetica: 0.25
    conmutador: 0.15
    contactor: 0.10
    seccionador_bajo_carga_con_fusible: 0.10
    interruptor_temporizado: 0.10

